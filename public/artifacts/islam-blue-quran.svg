<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-islam-blue-quran" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <radialGradient id="glow-islam-blue-quran" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#34d399" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="url(#bg-islam-blue-quran)" />
  <circle cx="200" cy="130" r="110" fill="url(#glow-islam-blue-quran)" />
  
  <!-- Outer border -->
  <rect x="12" y="12" width="376" height="276" rx="8" fill="none" stroke="#34d399" stroke-opacity="0.25" stroke-width="1.5" />
  <rect x="16" y="16" width="368" height="268" rx="6" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1" />
  
  <!-- Corner decorative brackets -->
  <path d="M 22 34 L 22 22 L 34 22" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <path d="M 378 34 L 378 22 L 366 22" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <path d="M 22 266 L 22 278 L 34 278" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <path d="M 378 266 L 378 278 L 366 278" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  
  <!-- Central Icon / Illustration -->
  <g transform="translate(200, 130)">
    
  <rect x="-50" y="-35" width="100" height="70" rx="4" fill="#1e3a8a" stroke="#34d399" stroke-width="2"/>
  <path d="M -38 -15 Q -15 -30 10 -15 T 38 -15 M -38 5 Q -15 -10 10 5 T 38 5 M -38 22 Q -15 10 10 22 T 38 22" stroke="#fbbf24" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  </g>
  
  <!-- Subtitle Tag -->
  <rect x="200" y="222" width="220" height="22" rx="11" transform="translate(-110, 0)" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.4" stroke-width="1" />
  <text x="200" y="237" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#34d399" text-anchor="middle" letter-spacing="0.05em">KAIROUAN · C. 9TH CENT. CE</text>
  
  <!-- Title -->
