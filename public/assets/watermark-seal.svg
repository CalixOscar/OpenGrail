<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <style>
      .ring { fill: none; stroke: currentColor; stroke-width: 1.2; }
      .ring-fine { fill: none; stroke: currentColor; stroke-width: 0.6; stroke-dasharray: 4,4; }
      .axis { stroke: currentColor; stroke-width: 0.8; opacity: 0.7; }
      .node-core { fill: currentColor; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; letter-spacing: 0.28em; fill: currentColor; font-weight: 600; text-transform: uppercase; }
    </style>
    <path id="textPathTop" d="M 120,400 A 280,280 0 0,1 680,400" />
    <path id="textPathBottom" d="M 680,400 A 280,280 0 0,1 120,400" />
  </defs>

  <g transform="translate(400, 400)">
    <!-- Concentric Celestial Spheres -->
    <circle cx="0" cy="0" r="370" class="ring" />
    <circle cx="0" cy="0" r="358" class="ring-fine" />
    <circle cx="0" cy="0" r="280" class="ring" />
    <circle cx="0" cy="0" r="268" class="ring" />
    <circle cx="0" cy="0" r="190" class="ring-fine" />
    <circle cx="0" cy="0" r="120" class="ring" />
    <circle cx="0" cy="0" r="45" class="ring" />

    <!-- Cardinal Rays & Astrolabe Ticks -->
    <line x1="-370" y1="0" x2="370" y2="0" class="axis" />
    <line x1="0" y1="-370" x2="0" y2="370" class="axis" />
    <line x1="-261" y1="-261" x2="261" y2="261" class="axis" stroke-dasharray="6,6" />
    <line x1="-261" y1="261" x2="261" y2="-261" class="axis" stroke-dasharray="6,6" />

    <!-- 12 Astrological / Chronological Radial Rays -->
    <g class="axis" opacity="0.4">
      <line x1="0" y1="-358" x2="0" y2="-370" stroke-width="2" />
      <line x1="185" y1="-320" x2="191" y2="-331" stroke-width="2" />
      <line x1="320" y1="-185" x2="331" y2="-191" stroke-width="2" />
      <line x1="358" y1="0" x2="370" y2="0" stroke-width="2" />
      <line x1="320" y1="185" x2="331" y2="191" stroke-width="2" />
      <line x1="185" y1="320" x2="191" y2="331" stroke-width="2" />
      <line x1="0" y1="358" x2="0" y2="370" stroke-width="2" />
      <line x1="-185" y1="320" x2="-191" y2="331" stroke-width="2" />
      <line x1="-320" y1="185" x2="-331" y2="191" stroke-width="2" />
      <line x1="-358" y1="0" x2="-370" y2="0" stroke-width="2" />
      <line x1="-320" y1="-185" x2="-331" y2="-191" stroke-width="2" />
      <line x1="-185" y1="-320" x2="-191" y2="-331" stroke-width="2" />
    </g>

    <!-- Sacred Geometry Interlocking Arcs -->
    <circle cx="-60" cy="-60" r="120" class="ring-fine" opacity="0.5" />
    <circle cx="60" cy="-60" r="120" class="ring-fine" opacity="0.5" />
    <circle cx="60" cy="60" r="120" class="ring-fine" opacity="0.5" />
    <circle cx="-60" cy="60" r="120" class="ring-fine" opacity="0.5" />

    <!-- OpenGrail Core Constellation Knot -->
    <g transform="scale(3)">
      <circle cx="0" cy="0" r="4" class="node-core" />
      <circle cx="-20" cy="-16" r="3" class="node-core" />
      <circle cx="20" cy="-18" r="3" class="node-core" />
      <circle cx="22" cy="18" r="3" class="node-core" />
      <circle cx="-22" cy="18" r="3" class="node-core" />
      <path d="M-20,-16 L0,0 L20,-18 M22,18 L0,0 L-22,18" class="ring" stroke-width="1" />
    </g>
  </g>

  <!-- Circumferential Archival Inscription -->
  <text class="label-text">
    <textPath href="#textPathTop" startOffset="50%" text-anchor="middle">
      OPENGRAIL • COMPARATIVE RELIGION ATLAS
    </textPath>
  </text>
  <text class="label-text">
    <textPath href="#textPathBottom" startOffset="50%" text-anchor="middle">
      100,000 BCE — PRESENT • CALMDOWNOSCAR.COM
    </textPath>
  </text>
</svg>
